# On demand: PNG throughput of vio vs fpnge (encoding, x86 only), image-png
# (decoding, checksums verified as by vio and libpng, and its fast encoding
# mode; at the "none" level built without its run-time SIMD checksums),
# Wuffs (decoding) and libpng 1.6 with zlib, all built on the runner, over
# the QOI benchmark corpus
# (tests/png-bench/), at each SIMD level: vio forced by JSIMD_*, the others
# from their build for that level (tests/CMakeLists.txt).  No macOS arm64
# job: that runner is a virtualized M1, so macOS arm64 is measured on a
# local Mac.  Each run uploads
# the per-file results and a summary.
name: bench-png

on:
  workflow_dispatch:
    inputs:
      sample:
        description: "Use 1 of every N corpus images"
        default: "1"

permissions:
  contents: read

jobs:
  bench:
    name: bench-png · ${{ matrix.name }} · ${{ matrix.level }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    # One job per platform and SIMD level (each job's runner may have a
    # different processor, so every job runs all the libraries).
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-x64, os: ubuntu-24.04, fpnge: true, level: avx2, isa: avx2=}
          - {name: linux-x64, os: ubuntu-24.04, fpnge: true, level: sse2, isa: sse2=JSIMD_FORCESSE2=1}
          - {name: linux-x64, os: ubuntu-24.04, level: none, isa: none=JSIMD_FORCENONE=1}
          - {name: linux-arm64, os: ubuntu-24.04-arm, level: neon, isa: neon=}
          - {name: linux-arm64, os: ubuntu-24.04-arm, level: none, isa: none=JSIMD_FORCENONE=1}
          - {name: macos-x64, os: macos-15-intel, fpnge: true, level: avx2, isa: avx2=}
          - {name: macos-x64, os: macos-15-intel, fpnge: true, level: sse2, isa: sse2=JSIMD_FORCESSE2=1}
          - {name: macos-x64, os: macos-15-intel, level: none, isa: none=JSIMD_FORCENONE=1}
          - {name: windows-x64, os: windows-2025, fpnge: true, level: avx2, isa: avx2=}
          - {name: windows-x64, os: windows-2025, fpnge: true, level: sse2, isa: sse2=JSIMD_FORCESSE2=1}
          - {name: windows-x64, os: windows-2025, level: none, isa: none=JSIMD_FORCENONE=1}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      # before the MSVC environment, which confuses cargo's linker lookup
      # (without SIMD: also without image-png's run-time SIMD checksums)
      - name: Build image-png benchmark
        run: |
          if [ "${{ matrix.level }}" = none ]; then
            py=python3
            [ "$RUNNER_OS" = Windows ] && py=python
            $py tests/png-bench/image-png/build_portable.py
          else
            cargo build --release --manifest-path tests/png-bench/image-png/Cargo.toml
          fi

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ./.github/actions/msvc

      - name: Fetch sources and corpus
        run: |
          mkdir -p build/ref build/corpus
          git clone -q --depth 1 -b v1.6.59 https://github.com/pnggroup/libpng.git build/ref/libpng
          git clone -q https://github.com/madler/zlib.git build/ref/zlib
          git -C build/ref/zlib checkout -q v1.3.2
          mkdir -p build/ref/wuffs
          curl -fsSL --retry 3 -o build/ref/wuffs/wuffs-v0.4.c \
            https://raw.githubusercontent.com/google/wuffs/v0.4.0-alpha.9/release/c/wuffs-v0.4.c
          if [ "${{ matrix.fpnge }}" = true ]; then
            git clone -q https://github.com/veluca93/fpnge.git build/ref/fpnge
            git -C build/ref/fpnge checkout -q 097ebccf3d3db443d9a8f238b1deed010a82f961 ||
              echo "::warning::fpnge revision not found, using its default branch"
          fi
          curl -fsSL --retry 3 -o qoi.tar https://qoiformat.org/benchmark/qoi_benchmark_suite.tar
          tar xf qoi.tar -C build/corpus && rm qoi.tar

      - name: Build
        run: |
          args=(-DCMAKE_BUILD_TYPE=Release -DVIO_TEST_SCALAR=OFF
                -DVIO_LIBPNG_SOURCE_DIR=$PWD/build/ref/libpng
                -DVIO_ZLIB_SOURCE_DIR=$PWD/build/ref/zlib
                -DVIO_WUFFS_SOURCE_DIR=$PWD/build/ref/wuffs)
          targets=(png-bench png-bench-scalar)
          if [ "${{ matrix.fpnge }}" = true ]; then
            args+=(-DVIO_FPNGE_SOURCE_DIR=$PWD/build/ref/fpnge)
            targets+=(png-bench-sse)
          fi
          [ "$RUNNER_OS" = Windows ] && args+=(-G Ninja)
          cmake -S . -B build/vio "${args[@]}"
          cmake --build build/vio --parallel --target "${targets[@]}"

      - name: Benchmark
        run: |
          py=python3
          [ "$RUNNER_OS" = Windows ] && py=python
          exe=""
          [ "$RUNNER_OS" = Windows ] && exe=.exe
          tag=${{ matrix.name }}-${{ matrix.level }}
          ipdir=release
          [ "${{ matrix.level }}" = none ] && ipdir=portable/release
          mkdir -p results
          $py tests/png-bench/png_bench.py run --corpus build/corpus \
            --out results/png-$tag.txt --sample ${{ inputs.sample }} --reps 3 \
            --vio build/vio/png-bench$exe --bin none=build/vio/png-bench-scalar$exe \
            --bin sse2=build/vio/png-bench-sse$exe --isa ${{ matrix.isa }} \
            --image-png tests/png-bench/image-png/target/$ipdir/png-bench-image-png$exe
          { echo "### $tag"; echo '```';
            $py tests/png-bench/png_bench.py report results/png-$tag.txt --by-category;
            echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          uname -a > results/cpu-$tag.txt || true
          if [ "$RUNNER_OS" = Linux ]; then lscpu >> results/cpu-$tag.txt; fi
          if [ "$RUNNER_OS" = macOS ]; then sysctl -n machdep.cpu.brand_string >> results/cpu-$tag.txt; fi
          if [ "$RUNNER_OS" = Windows ]; then powershell -c "(Get-CimInstance Win32_Processor).Name" >> results/cpu-$tag.txt; fi

      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: bench-png-${{ matrix.name }}-${{ matrix.level }}
          path: results/
