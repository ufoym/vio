# Publishes docs/ (the project page) to GitHub Pages.  Repository settings:
# Pages > Build and deployment > Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
    paths: [docs/**, README.md, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The page's numbers come from the README's tables.
      - name: Generate data.js
        run: python3 docs/gen_data.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
