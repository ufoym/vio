# Every push / pull request:
#   test    the full conformance suite (simd + scalar variants) on every
#           supported architecture; real hardware where GitHub has it, QEMU
#           user-mode emulation for the rest.  Jobs with several "runs" repeat
#           the suite with the JSIMD_* variables (or QEMU CPU model) selecting
#           each instruction-set level; repeats skip the scalar variant.
#   bench   jpeg-bench throughput, vio vs libjpeg-turbo built from the test
#           submodule on the same runner, per instruction-set level, plus a
#           per-function compression profile of both, and IJG libjpeg (no
#           SIMD) as a baseline.  Only on real hardware:
#           emulated timings say nothing.
#   report  one Markdown report (job summary) + HTML report (artifact).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test · ${{ matrix.name }}${{ matrix.shard && format(' · {0} {1}', matrix.tag, matrix.shard) || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout || 120 }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # timeout: job limit in minutes (default 120); test_timeout: per-test
          # limit in seconds (default 1800)
          # runs: one per line, "label|VAR=value ...|extra ctest args"
          - name: linux-x64-gcc
            os: ubuntu-24.04
            runs: |
              avx2||
              sse2|JSIMD_FORCESSE2=1|-E scalar
          - name: linux-x64-clang
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
            runs: |
              avx2||
          - name: linux-i686
            os: ubuntu-24.04
            apt: g++-i686-linux-gnu
            triple: i686-linux-gnu
            proc: i686
            runs: |
              avx2||
              sse2|JSIMD_FORCESSE2=1|-E scalar
              sse+mmx|JSIMD_FORCESSE=1|-E scalar
          - name: linux-arm64-gcc
            os: ubuntu-24.04-arm
            runs: |
              neon||
          - name: macos-arm64
            os: macos-15
            runs: |
              neon||
          - name: macos-x64
            os: macos-15-intel
            runs: |
              avx2||
              sse2|JSIMD_FORCESSE2=1|-E scalar
          - name: windows-x64-msvc
            os: windows-2025
            msvc: x64
            cc: cl
            cxx: cl
            runs: |
              avx2||
              sse2|JSIMD_FORCESSE2=1|-E scalar
          - name: windows-x64-clang-cl
            os: windows-2025
            msvc: x64
            cc: clang-cl
            cxx: clang-cl
            runs: |
              avx2||
          - name: windows-x86-msvc
            os: windows-2025
            msvc: x86
            cc: cl
            cxx: cl
            runs: |
              avx2||
              sse2|JSIMD_FORCESSE2=1|-E scalar
          - name: linux-armhf-neon (qemu)
            os: ubuntu-24.04
            apt: g++-arm-linux-gnueabihf
            triple: arm-linux-gnueabihf
            proc: arm
            flags: -mfpu=neon
            emulator: qemu-arm
            runs: |
              neon|QEMU_CPU=cortex-a15|
          - name: linux-armhf-runtime (qemu)
            os: ubuntu-24.04
            apt: g++-arm-linux-gnueabihf
            triple: arm-linux-gnueabihf
            proc: armrt
            emulator: qemu-arm
            runs: |
              neon-detected|QEMU_CPU=cortex-a15|
              no-neon|QEMU_CPU=cortex-r5f|-E scalar
          - name: linux-ppc64le (qemu)
            os: ubuntu-24.04
            apt: g++-powerpc64le-linux-gnu
            triple: powerpc64le-linux-gnu
            proc: ppc64le
            flags: -mcpu=power8
            emulator: qemu-ppc64le
            runs: |
              altivec+vsx||
          - name: linux-ppc32-be (qemu)
            os: ubuntu-24.04
            apt: g++-14-powerpc-linux-gnu
            triple: powerpc-linux-gnu
            sfx: "-14"
            proc: ppc
            flags: -mcpu=7450 -maltivec
            emulator: qemu-ppc
            runs: |
              altivec|QEMU_CPU=7450_v2.0|
          - name: linux-mips64el (qemu)
            os: ubuntu-24.04
            apt: g++-mips64el-linux-gnuabi64
            triple: mips64el-linux-gnuabi64
            proc: mips64el
            flags: -march=loongson3a
            emulator: qemu-mips64el
            runs: |
              mmi|QEMU_CPU=Loongson-3A1000|
          # QEMU emulates RVV slowly: one run takes hours on a single runner, so
          # the RISC-V runs are split into shards (tests that depend on each
          # other stay together, see shard.py), and the 8-bit tjunittest alone
          # can need more than 30 minutes.
          - name: linux-riscv64 (qemu)
            os: ubuntu-24.04
            apt: g++-14-riscv64-linux-gnu
            triple: riscv64-linux-gnu
            sfx: "-14"
            proc: riscv64
            flags: -march=rv64gcv
            emulator: qemu-riscv64
            timeout: 240
            test_timeout: 10800
            tag: vlen128
            shard: 1/4
            runs: |
              rvv-vlen128|QEMU_CPU=rv64,v=true,vlen=128|
          - name: linux-riscv64 (qemu)
            os: ubuntu-24.04
            apt: g++-14-riscv64-linux-gnu
            triple: riscv64-linux-gnu
            sfx: "-14"
            proc: riscv64
            flags: -march=rv64gcv
            emulator: qemu-riscv64
            timeout: 240
            test_timeout: 10800
            tag: vlen128
            shard: 2/4
            runs: |
              rvv-vlen128|QEMU_CPU=rv64,v=true,vlen=128|
          - name: linux-riscv64 (qemu)
            os: ubuntu-24.04
            apt: g++-14-riscv64-linux-gnu
            triple: riscv64-linux-gnu
            sfx: "-14"
            proc: riscv64
            flags: -march=rv64gcv
            emulator: qemu-riscv64
            timeout: 240
            test_timeout: 10800
            tag: vlen128
            shard: 3/4
            runs: |
              rvv-vlen128|QEMU_CPU=rv64,v=true,vlen=128|
          - name: linux-riscv64 (qemu)
            os: ubuntu-24.04
            apt: g++-14-riscv64-linux-gnu
            triple: riscv64-linux-gnu
            sfx: "-14"
            proc: riscv64
            flags: -march=rv64gcv
            emulator: qemu-riscv64
            timeout: 240
            test_timeout: 10800
            tag: vlen128
            shard: 4/4
            runs: |
              rvv-vlen128|QEMU_CPU=rv64,v=true,vlen=128|
          - name: linux-riscv64 (qemu)
            os: ubuntu-24.04
            apt: g++-14-riscv64-linux-gnu
            triple: riscv64-linux-gnu
            sfx: "-14"
            proc: riscv64
            flags: -march=rv64gcv
            emulator: qemu-riscv64
            timeout: 240
            test_timeout: 10800
            tag: vlen256
            shard: 1/3
            runs: |
              rvv-vlen256|QEMU_CPU=rv64,v=true,vlen=256|-E scalar
          - name: linux-riscv64 (qemu)
            os: ubuntu-24.04
            apt: g++-14-riscv64-linux-gnu
            triple: riscv64-linux-gnu
            sfx: "-14"
            proc: riscv64
            flags: -march=rv64gcv
            emulator: qemu-riscv64
            timeout: 240
            test_timeout: 10800
            tag: vlen256
            shard: 2/3
            runs: |
              rvv-vlen256|QEMU_CPU=rv64,v=true,vlen=256|-E scalar
          - name: linux-riscv64 (qemu)
            os: ubuntu-24.04
            apt: g++-14-riscv64-linux-gnu
            triple: riscv64-linux-gnu
            sfx: "-14"
            proc: riscv64
            flags: -march=rv64gcv
            emulator: qemu-riscv64
            timeout: 240
            test_timeout: 10800
            tag: vlen256
            shard: 3/3
            runs: |
              rvv-vlen256|QEMU_CPU=rv64,v=true,vlen=256|-E scalar
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Set up MSVC
        if: matrix.msvc
        uses: ./.github/actions/msvc
        with:
          arch: ${{ matrix.msvc }}

      - name: Install toolchain
        if: matrix.apt
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends ${{ matrix.apt }}

      # QEMU 10.2 (static, from the Ubuntu 26.04 release pocket) instead of
      # the runner's 8.2: about 1.4x faster on the RVV tjunittest runs.
      - name: Install QEMU
        if: matrix.emulator
        run: |
          deb=qemu-user_10.2.1+ds-1ubuntu3_amd64.deb
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$deb" \
            "http://archive.ubuntu.com/ubuntu/pool/universe/q/qemu/$deb"
          echo "e6bdaac070232a44b8657cad84ac0853d84b7167b55af82370af040291f55bd8  $RUNNER_TEMP/$deb" |
            sha256sum -c -
          dpkg -x "$RUNNER_TEMP/$deb" "$RUNNER_TEMP/qemu"
          "$RUNNER_TEMP/qemu/usr/bin/${{ matrix.emulator }}" --version

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          args=(-DCMAKE_BUILD_TYPE=Release)
          if [ -n "${{ matrix.triple }}" ]; then
            t=${{ matrix.triple }} s=${{ matrix.sfx }}
            args+=(-DCMAKE_SYSTEM_NAME=Linux
                   -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.proc }}
                   -DCMAKE_C_COMPILER=$t-gcc$s -DCMAKE_CXX_COMPILER=$t-g++$s
                   "-DCMAKE_C_FLAGS=${{ matrix.flags }}"
                   "-DCMAKE_CXX_FLAGS=${{ matrix.flags }}"
                   -DCMAKE_EXE_LINKER_FLAGS=-static)
            if [ -n "${{ matrix.emulator }}" ]; then
              args+=(-DCMAKE_CROSSCOMPILING_EMULATOR=$RUNNER_TEMP/qemu/usr/bin/${{ matrix.emulator }})
            fi
          fi
          [ "$RUNNER_OS" = Windows ] && args+=(-G Ninja)
          [ -z "$CC" ] && unset CC CXX
          cmake -S . -B build/ci "${args[@]}"

      - name: Build
        run: cmake --build build/ci --parallel

      - name: Test
        env:
          NAME: ${{ matrix.name }}
          RUNS: ${{ matrix.runs }}
          SHARD: ${{ matrix.shard }}
          TEST_TIMEOUT: ${{ matrix.test_timeout || 1800 }}
        run: |
          while IFS='|' read -r label envs ctargs; do
            [ -n "$label" ] || continue
            echo "::group::$NAME · $label${SHARD:+ shard $SHARD}"
            # shellcheck disable=SC2086
            .github/scripts/run-ctest.sh build/ci "$NAME" "$label" \
              $envs -- $ctargs
            echo "::endgroup::"
          done <<< "$RUNS"
          if [ -f results/.failed ]; then
            echo "::error::failing runs: $(paste -sd, results/.failed)"
            exit 1
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-${{ strategy.job-index }}
          path: results/
          include-hidden-files: true
          if-no-files-found: ignore

  bench:
    name: bench · ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            isas: --isa avx2= --isa sse2=JSIMD_FORCESSE2=1 --isa none=JSIMD_FORCENONE=1
          - name: linux-arm64
            os: ubuntu-24.04-arm
            isas: --isa neon= --isa none=JSIMD_FORCENONE=1
          - name: macos-arm64
            os: macos-15
            isas: --isa neon= --isa none=JSIMD_FORCENONE=1
          - name: macos-x64
            os: macos-15-intel
            isas: --isa avx2= --isa sse2=JSIMD_FORCESSE2=1 --isa none=JSIMD_FORCENONE=1
          - name: windows-x64
            os: windows-2025
            isas: --isa avx2= --isa sse2=JSIMD_FORCESSE2=1 --isa none=JSIMD_FORCENONE=1
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ./.github/actions/msvc

      - name: Install NASM
        if: contains(matrix.name, 'x64')
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install nasm
          elif [ "$RUNNER_OS" = Windows ]; then
            choco install -y --no-progress nasm
            echo "C:\Program Files\NASM" >> "$GITHUB_PATH"
          else sudo apt-get update -q && sudo apt-get install -yq nasm; fi

      - name: Install profiler
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq linux-tools-common "linux-tools-$(uname -r)" ||
            sudo apt-get install -yq linux-tools-generic
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0

      # IJG libjpeg, built with the vio tree (jpeg-bench-libjpeg); the benchmark
      # runs without it if the download fails.
      - name: Download IJG libjpeg
        continue-on-error: true
        run: |
          curl -fsSL --retry 3 -o jpegsrc.tar.gz https://www.ijg.org/files/jpegsrc.v10.tar.gz
          sha256="sha256sum"
          command -v sha256sum > /dev/null || sha256="shasum -a 256"
          echo "8b9eaa13242690ebd03e1728ab1edf97a81a78ed6e83624d493655f31ac95ab5  jpegsrc.tar.gz" |
            $sha256 -c -
          mkdir -p build && tar xzf jpegsrc.tar.gz -C build

      - name: Build vio jpeg-bench
        run: |
          if [ -d build/jpeg-10 ]; then
            libjpeg="-DVIO_LIBJPEG_SOURCE_DIR=$PWD/build/jpeg-10"
            targets="jpeg-bench jpeg-bench-libjpeg"
          else
            libjpeg=""
            targets="jpeg-bench"
          fi
          gen=""
          [ "$RUNNER_OS" = Windows ] && gen="-G Ninja"
          cmake -S . -B build/vio $gen -DCMAKE_BUILD_TYPE=Release -DVIO_TEST_SCALAR=OFF $libjpeg
          cmake --build build/vio --parallel --target $targets

      - name: Build libjpeg-turbo tjbench
        run: |
          gen=""
          [ "$RUNNER_OS" = Windows ] && gen="-G Ninja"
          cmake -S tests/third_party/libjpeg-turbo -B build/ljt $gen -DCMAKE_BUILD_TYPE=Release
          cmake --build build/ljt --parallel --target tjbench

      - name: Benchmark
        run: |
          libjpeg=""
          if [ -x build/vio/jpeg-bench-libjpeg ]; then libjpeg="--libjpeg build/vio/jpeg-bench-libjpeg"; fi
          py=python3
          [ "$RUNNER_OS" = Windows ] && py=python
          $py bench/jpeg/jpeg_bench.py --platform ${{ matrix.name }} \
            --vio build/vio/jpeg-bench --ref build/ljt/tjbench ${{ matrix.isas }} \
            $libjpeg --out results/bench-${{ matrix.name }}.json

      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: bench-${{ matrix.name }}
          path: results/

  report:
    needs: [test, bench]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          path: results
      - name: Build report
        run: |
          mkdir -p report
          python3 .github/scripts/report.py results report/report.md report/index.html
          cat report/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: report
          path: report/
