# On demand: the Linux x86-64 benchmark (as in ci.yml) on several runners at
# once.  Hosted x86-64 runners come with different CPUs (AMD EPYC of several
# generations, Intel Xeon); each copy records the CPU it ran on, so a few
# copies sample the processors that are otherwise reached only by chance.
name: Bench x86-64

on:
  workflow_dispatch:
    inputs:
      isas:
        description: bench.py --isa arguments
        default: --isa avx2= --isa sse2=JSIMD_FORCESSE2=1 --isa none=JSIMD_FORCENONE=1

permissions:
  contents: read

jobs:
  bench:
    name: bench · copy ${{ matrix.copy }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        copy: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install NASM and profiler
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq nasm
          sudo apt-get install -yq linux-tools-common "linux-tools-$(uname -r)" ||
            sudo apt-get install -yq linux-tools-generic || true
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0

      # IJG libjpeg (see ci.yml); the benchmark runs without it if the
      # download fails.
      - name: Download IJG libjpeg
        continue-on-error: true
        run: |
          curl -fsSL --retry 3 -o jpegsrc.tar.gz https://www.ijg.org/files/jpegsrc.v10.tar.gz
          sha256="sha256sum"
          command -v sha256sum > /dev/null || sha256="shasum -a 256"
          echo "8b9eaa13242690ebd03e1728ab1edf97a81a78ed6e83624d493655f31ac95ab5  jpegsrc.tar.gz" |
            $sha256 -c -
          mkdir -p build && tar xzf jpegsrc.tar.gz -C build

      - name: Build
        run: |
          libjpeg=""
          targets="tjbench"
          if [ -d build/jpeg-10 ]; then
            libjpeg="-DVIO_LIBJPEG_SOURCE_DIR=$PWD/build/jpeg-10"
            targets="tjbench tjbench-libjpeg"
          fi
          cmake -S . -B build/vio -DCMAKE_BUILD_TYPE=Release -DVIO_TEST_SCALAR=OFF $libjpeg
          cmake --build build/vio --parallel --target $targets
          cmake -S tests/libjpeg-turbo -B build/ljt -DCMAKE_BUILD_TYPE=Release
          cmake --build build/ljt --parallel --target tjbench

      - name: Benchmark
        run: |
          libjpeg=""
          [ -x build/vio/tjbench-libjpeg ] && libjpeg="--libjpeg build/vio/tjbench-libjpeg"
          python3 .github/scripts/bench.py --platform linux-x64-${{ matrix.copy }} \
            --vio build/vio/tjbench --ref build/ljt/tjbench ${{ inputs.isas }} \
            $libjpeg --out results/bench-linux-x64-${{ matrix.copy }}.json

      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: bench-linux-x64-${{ matrix.copy }}
          path: results/
