[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vio"
version = "0.1.0"
description = "Fast image decoding and encoding: JPEG, PNG, BMP, GIF, PPM and Targa"
readme = "bind/python/README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
dependencies = ["numpy"]

[project.urls]
Homepage = "https://github.com/ufoym/vio"

[tool.setuptools]
package-dir = { "" = "bind/python" }
packages = ["vio"]
